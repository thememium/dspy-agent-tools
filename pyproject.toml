[project]
name = "dspy-agent-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "isort>=9.0.1",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.81",
    "usechange>=0.1.46",
]

[tool.deptry]
known_first_party = ["dspy_agent_tools"]

[tool.poe.tasks]
dev = "uv run main.py"
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
test = "uv run pytest tests/ -v"
test-cov = "uv run pytest tests/ -v --cov=dspy_agent_tools --cov-report=term-missing"
test-e2e = "uv run pytest tests/ -v --run-e2e"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv run deptry ."
typecheck = "uv run ty check"
audit = "uv audit"
security = "uv run bandit -r . -x './.venv/*'"
release = "uv run usechange release"
