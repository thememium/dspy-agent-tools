[project]
name = "dspy-agent-tools"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Edward Boswell", email = "thememium@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
# license = "MIT"
# license-files = ["LICEN[CS]E*"]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "ddgs>=9.16.0",
  "markdownify>=1.2.3",
  "plumbum>=2.0.2",
  "rgapi>=0.2.2",
  "tree-sitter-language-pack>=1.20.0",
]

[project.scripts]
dspy_agent_tools = "dspy_agent_tools:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "isort>=9.0.1",
  "poethepoet>=0.48.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "ty>=0.0.81",
  "usechange>=0.1.46",
]

[tool.deptry]
known_first_party = ["dspy_agent_tools"]

[tool.isort]
profile = "black"

[project.urls]
Homepage = "https://github.com/thememium/dspy-agent-tools"
Documentation = "https://github.com/thememium/dspy-agent-tools"
Repository = "https://github.com/thememium/dspy-agent-tools.git"
Issues = "https://github.com/thememium/dspy-agent-tools/issues"
Changelog = "https://github.com/thememium/dspy-agent-tools/blob/master/CHANGELOG.md"

[tool.ty]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.ty.rules]
# Ty uses rule = "level" format (error, warn, ignore)
# See all rules at: https://docs.astral.sh/ty/reference/rules/

[tool.poe.tasks]
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
test = "uv run pytest tests/ -v"
test-cov = "uv run pytest tests/ -v --cov=dspy_agent_tools --cov-report=term-missing"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv run deptry ."
typecheck = "uv run ty check"
audit = "uv audit"
security = "uv run bandit -r . -x './.venv/*'"
release = "uv run usechange release"
